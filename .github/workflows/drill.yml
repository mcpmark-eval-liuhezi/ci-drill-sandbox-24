name: Drill

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stuck-build-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate a stuck build
        run: |
          echo "Drill workflow started at $(date). This job will sleep for 12 minutes to simulate a wedged CI build."
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sleep 720
          echo "Drill workflow finished."
